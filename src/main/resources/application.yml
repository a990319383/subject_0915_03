server:
  port: 8080
  tomcat:
    threads:
      max: 250

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 10000
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 不使用 Shiro 注解式鉴权（仅 URL 过滤链），关闭其注解代理处理器，
# 避免与事务代理叠加产生 JDK 代理导致按类型注入失败。
shiro:
  annotations:
    enabled: false

# 台账种子数据：mvn spring-boot:run -Dspring-boot.run.arguments=--evops.seed.enabled=true
evops:
  seed:
    enabled: false
    order-count: 85000
    store-count: 2
    bays-per-store: 10
    card-count: 5000
    card-times: 30
    batch-size: 1000

logging:
  level:
    com.evops: INFO
